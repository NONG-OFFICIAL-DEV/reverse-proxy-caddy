name: Deploy Caddy Reverse Proxy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Caddy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "Caddyfile,sites,docker-compose.yml"
          target: "/home/ubuntu/reverse-proxy"

      - name: Restart Caddy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/reverse-proxy

            # Free RAM before deploy
            sudo sync && echo 3 | sudo tee /proc/sys/vm/drop_caches
            docker image prune -f

            # Deploy cleanly
            docker pull caddy:2
            docker compose down --remove-orphans || true
            docker compose up -d