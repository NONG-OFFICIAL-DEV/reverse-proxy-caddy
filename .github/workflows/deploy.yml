name: Deploy Caddy Reverse Proxy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Caddy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "Caddyfile,sites,docker-compose.yml"
          target: "/home/ubuntu/reverse-proxy"

      - name: Restart Caddy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/reverse-proxy

            docker image prune -f

            # Deploy cleanly
            docker pull caddy:2
            docker compose down --remove-orphans || true

            # A container can end up named "global-proxy" without being
            # tracked under this compose project (e.g. started manually,
            # or from before this project's name/target path settled) —
            # `compose down` above can't find/remove it in that case, but
            # `compose up` still collides on the literal container name.
            # Remove it by name directly so redeploys are self-healing
            # instead of failing on this same conflict every time.
            docker rm -f global-proxy 2>/dev/null || true

            docker compose up -d