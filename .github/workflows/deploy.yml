name: Deploy Caddy Reverse Proxy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Caddy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "Caddyfile,sites,docker-compose.yml"
          target: "/home/ubuntu/reverse-proxy"

      - name: Restart Caddy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/reverse-proxy

            # Kill any orphan caddy processes on host
            sudo pkill -9 -f "caddy run" || true
            sleep 2

            # Pull latest image
            docker pull caddy:2

            # Stop and remove old containers + orphans
            docker compose down --remove-orphans || true

            # Remove old unused images to free disk/RAM
            docker image prune -f

            # Start fresh
            docker compose up -d

            # Verify it's running
            docker compose ps